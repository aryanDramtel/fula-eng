name: fula_translator
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.1.14
  csv: ^6.0.0
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  change_app_package_name: ^1.1.0



flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/merged_dictionary_EN-FR-FDJ-FT.json

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
